name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/requirements-compliance"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STRIPE_API_KEY: sk_test_placeholder
      RESEND_API_KEY: re_test_placeholder
      RESEND_FROM_EMAIL: onboarding@resend.dev
      MIGRATOR_DB_URL: postgresql+psycopg://migrator:password@localhost:5432/ecommerce_test
      DB_USER: app_user
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ecommerce_test
      JWT_SECRET_KEY: test-secret-key-at-least-32-characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-prod.txt -r requirements-dev.txt
      - run: python -m compileall -q app main.py
      - run: pytest -q
